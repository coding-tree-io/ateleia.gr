name: Deploy Homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CONTACT_FORM_ENDPOINT: https://form.taxi/s/tb10t33e
      DECAP_REPOSITORY: ${{ vars.DECAP_REPOSITORY }}
      DECAP_BRANCH: ${{ vars.DECAP_BRANCH }}
      DECAP_SITE_URL: https://ateleiatherapy.gr/
      DECAP_LOGO_URL: ${{ vars.DECAP_LOGO_URL }}
      DECAPBRIDGE_BASE_URL: ${{ vars.DECAPBRIDGE_BASE_URL }}
      DECAPBRIDGE_AUTH_ENDPOINT: ${{ vars.DECAPBRIDGE_AUTH_ENDPOINT }}
      DECAPBRIDGE_AUTH_TOKEN_ENDPOINT: ${{ vars.DECAPBRIDGE_AUTH_TOKEN_ENDPOINT }}
      DECAPBRIDGE_GATEWAY_URL: ${{ vars.DECAPBRIDGE_GATEWAY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache npm CLI downloads (Lighthouse)
        uses: actions/cache@v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-lighthouse-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'scripts/check-lighthouse-budget.mjs', 'performance-budget.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-lighthouse-
            ${{ runner.os }}-npm-

      - name: Cache Astro and Vite build state
        uses: actions/cache@v5.0.5
        with:
          path: |
            .astro
            node_modules/.astro
            node_modules/.vite
          key: ${{ runner.os }}-astro-vite-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'astro.config.mjs', 'src/content.config.ts', 'src/content/**/*.ts', 'src/data/**/*.json', 'src/styles/**/*.css', 'src/components/**/*', 'src/pages/**/*', 'public/**/*') }}
          restore-keys: |
            ${{ runner.os }}-astro-vite-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks and build
        run: |
          pnpm run check
          pnpm run build

      - name: Enforce mobile performance budget
        run: pnpm run perf:budget

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
